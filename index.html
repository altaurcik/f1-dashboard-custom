<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>F1 Dashboard Custom</title>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<main class="shell">
			<header class="topbar">
				<section class="session">
					<div class="flag">MON</div>
					<div>
						<h1>Monaco Grand Prix: Qualifying Q3</h1>
						<p id="clock">00:08:42</p>
					</div>
				</section>

				<section class="conditions">
					<div><span>TRACK</span><strong>34 C</strong></div>
					<div><span>AIR</span><strong>25 C</strong></div>
					<div><span>HUM</span><strong>54%</strong></div>
					<div><span>WIND</span><strong>2.8</strong></div>
					<div class="status">Track Clear</div>
				</section>
			</header>

			<section class="dashboard">
				<aside class="leaderboard panel">
					<div class="panel-title">
						<h2>Timing</h2>
						<span>Best lap / gap</span>
					</div>
					<div id="drivers" class="driver-list"></div>
				</aside>

				<section class="right-stack">
					<section class="map-card panel">
						<div class="panel-title">
							<h2>Track Map</h2>
							<span>Live positions</span>
						</div>
						<div class="map-wrap">
							<svg class="track-map" viewBox="0 0 1000 620" role="img" aria-label="Track map">
								<path class="track-base" d="M122 406 C85 304 92 214 158 143 C242 52 386 74 424 154 C463 235 341 266 375 335 C406 399 543 331 640 355 C754 383 830 462 774 534 C726 597 566 572 469 521 C379 474 188 584 122 406 Z" />
								<path class="track-line" d="M122 406 C85 304 92 214 158 143 C242 52 386 74 424 154 C463 235 341 266 375 335 C406 399 543 331 640 355 C754 383 830 462 774 534 C726 597 566 572 469 521 C379 474 188 584 122 406 Z" />
								<g id="cars"></g>
							</svg>
						</div>
					</section>

					<section class="bottom-grid">
						<section class="panel compact-panel">
							<div class="panel-title">
								<h2>Race Control</h2>
								<span>Latest messages</span>
							</div>
							<ul id="race-control" class="message-list"></ul>
						</section>

						<section class="panel compact-panel">
							<div class="panel-title">
								<h2>Radio</h2>
								<span>Audio clips</span>
							</div>
							<ul id="radio" class="radio-list"></ul>
						</section>
					</section>
				</section>
			</section>
		</main>

		<script src="./app.js"></script>
	</body>
</html>
